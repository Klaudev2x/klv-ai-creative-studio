<svg width="560" height="245" viewBox="0 0 560 245" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- K mark palette (same ramp as favicon logo) -->
    <linearGradient id="wlKRamp" x1="5" y1="12" x2="505" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38C4F5"/>
      <stop offset=".35" stop-color="#2F7EF6"/>
      <stop offset=".65" stop-color="#7C3BF8"/>
      <stop offset="1" stop-color="#C93CFF"/>
    </linearGradient>
    <linearGradient id="wlKArm" x1="490" y1="20" x2="270" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E7CF6"/>
      <stop offset="1" stop-color="#4A45F0"/>
    </linearGradient>
    <linearGradient id="wlKPlay" x1="340" y1="235" x2="420" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F9BF7"/>
      <stop offset="1" stop-color="#8F35F8"/>
    </linearGradient>
    <!-- Dash between LV and AI -->
    <linearGradient id="wlDashGrad" x1="360" y1="0" x2="396" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38C4F5"/>
      <stop offset="1" stop-color="#C93CFF"/>
    </linearGradient>
    <!-- Underline -->
    <linearGradient id="wlLineGrad" x1="200" y1="0" x2="370" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38C4F5"/>
      <stop offset="1" stop-color="#B43BF5"/>
    </linearGradient>
  </defs>

  <!-- K mark as the brand's leading letter -->
  <g transform="translate(0,8) scale(0.293)">
    <path fill="url(#wlKRamp)" d="
      M 175 100
      Q 175 12 90 12
      Q 5 12 5 100
      L 5 445
      Q 5 512 135 512
      L 505 512
      L 450 430
      L 195 330
      L 175 318
      Z"/>
    <path fill="url(#wlKArm)" d="M 195 310 L 490 8 L 505 85 L 255 355 Z"/>
    <path fill="url(#wlKPlay)" stroke="url(#wlKPlay)" stroke-width="48" stroke-linejoin="round" d="M 340 235 L 462 296 L 340 357 Z"/>
  </g>

  <!-- LV - AI -->
  <text x="168" y="158" fill="#FFFFFF" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="148" font-weight="800" letter-spacing="0" textLength="182" lengthAdjust="spacing">LV</text>
  <rect x="360" y="118" width="36" height="20" rx="10" fill="url(#wlDashGrad)"/>
  <text x="404" y="158" fill="#FFFFFF" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="148" font-weight="800" letter-spacing="0" textLength="142" lengthAdjust="spacing">AI</text>

  <!-- CREATIVE STUDIO tagline -->
  <text x="85" y="212" fill="#F2F4F8" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="2" textLength="400" lengthAdjust="spacing">CREATIVE STUDIO</text>

  <!-- Gradient underline -->
  <rect x="200" y="228" width="170" height="6" rx="3" fill="url(#wlLineGrad)"/>
</svg>
